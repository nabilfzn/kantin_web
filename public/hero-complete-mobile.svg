<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 600 280" role="img" aria-labelledby="title-mob desc-mob">
<title id="title-mob">Pesan Makanan Kantin Lebih Cepat dan Rapi</title>
<desc id="desc-mob">Hero kantin hijau minimalis vertikal proporsional untuk tampilan mobile tanpa tombol.</desc>
<defs>
  <linearGradient id="bg-m" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#075A30"/><stop offset=".55" stop-color="#006438"/><stop offset="1" stop-color="#0B6B37"/></linearGradient>
  <linearGradient id="wave-m" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#1A9454"/><stop offset="1" stop-color="#43A965"/></linearGradient>
  <linearGradient id="bowl-m" x1="0" y1="0" x2=".65" y2="1"><stop offset="0" stop-color="#FFFDF8"/><stop offset=".53" stop-color="#E6E6E0"/><stop offset="1" stop-color="#ADB9B0"/></linearGradient>
  <radialGradient id="broth-m"><stop offset="0" stop-color="#A94E18"/><stop offset=".75" stop-color="#804015"/><stop offset="1" stop-color="#593115"/></radialGradient>
  <radialGradient id="meat-m"><stop offset="0" stop-color="#DCC59A"/><stop offset=".7" stop-color="#B38C5E"/><stop offset="1" stop-color="#8B6943"/></radialGradient>
  <filter id="shadow-m" x="-30%" y="-30%" width="160%" height="180%"><feGaussianBlur stdDeviation="6"/></filter>
  <clipPath id="noodleClip-m"><ellipse cx="465" cy="140" rx="98" ry="42"/></clipPath>
</defs>
<rect width="600" height="280" rx="24" fill="url(#bg-m)"/>
<clipPath id="outer-m"><rect width="600" height="280" rx="24"/></clipPath>
<g clip-path="url(#outer-m)">
  <path d="M0 248 C70 215 110 250 190 280 H0Z" fill="#1C9654" opacity=".65"/>
  <path d="M220 280 C300 205 380 185 450 198 C530 212 570 178 600 140 V280 Z" fill="url(#wave-m)" opacity=".7"/>
  <path d="M410 280 C480 225 545 220 600 175 V280Z" fill="#0B7B43" opacity=".35"/>
</g>

